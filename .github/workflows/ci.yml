# Tests on every push (except main, which runs them inside deploy.yml) and on pull requests.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call: # reused by deploy.yml

permissions:
  contents: read

jobs:
  test:
    name: Testes (API + web)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL + pgvector for the database tests.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: acaia
          POSTGRES_PASSWORD: acaia
          POSTGRES_DB: acaia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acaia -d acaia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://acaia:acaia@localhost:5432/acaia
      # In CI a missing database must FAIL the run, not silently skip tests.
      REQUIRE_TEST_DB: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build do chat (garante que compila)
        run: npm run build -w apps/web
