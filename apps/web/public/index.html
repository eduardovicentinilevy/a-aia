<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AçaIA</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫐</text></svg>"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">🫐</span>
          <span>AçaIA</span>
          <span class="badge">Fase 0</span>
        </div>
        <button id="new-chat" class="btn btn-ghost" type="button">Nova conversa</button>
      </header>

      <main id="messages" class="messages" role="log" aria-label="Conversa">
        <div id="empty-state" class="empty">
          <h1>Oi! Eu sou a AçaIA.</h1>
          <p>Pergunte o que quiser. Respondo em português e sem enrolação.</p>
        </div>
      </main>

      <form id="composer" class="composer" autocomplete="off">
        <label for="input" class="sr-only">Mensagem</label>
        <textarea id="input" rows="1" maxlength="8000" placeholder="Escreva sua mensagem…" autofocus></textarea>
        <button id="send" class="btn btn-primary" type="submit">Enviar</button>
        <button id="stop" class="btn btn-ghost" type="button" hidden>Parar</button>
      </form>
      <p class="disclaimer">A AçaIA pode errar. Confira informações importantes.</p>
    </div>
  </body>
</html>
