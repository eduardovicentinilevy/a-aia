# Local development database: PostgreSQL 17 + pgvector.
# Usage (from the repo root): npm run db:up   /   npm run db:down
name: acaia

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: acaia
      POSTGRES_PASSWORD: acaia
      POSTGRES_DB: acaia
    ports:
      # Host port 5433 (not the default 5432) so it never clashes with a PostgreSQL installed
      # directly on the machine. Bound to 127.0.0.1: not reachable from your network.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acaia -d acaia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
